[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braidge-tools"
version = "0.1.0"
description = "Reusable inch-fraction, geometry, DXF, and cutout validation tools for stone countertop software."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Braidge" }
]
keywords = ["stone fabrication", "countertops", "dxf", "geometry", "inch fractions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "ezdxf>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/braidge_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
